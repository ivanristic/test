apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app-rollout
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/ivanristic/test.git'
    targetRevision: rollouts
    path: charts/demo-app
    helm:
      parameters:
        - name: target-url
          value: "http://demo-app-rollout.demo-testing.svc"
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: demo-testing
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
