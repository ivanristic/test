apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app-workflow
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/ivanristic/test.git'
    targetRevision: demo
    path: charts/demo-app
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: demo-testing
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
