apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: git-fetched-api-tests-workflow
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  entrypoint: registry-test-pipeline
  serviceAccountName: workflow-runner-sa
  
  # Hooking up the exit handler block
  onExit: send-email-report

  templates:
    - name: registry-test-pipeline
      steps:
        - - name: test-registry
            template: registry-tester
            # Escaped for Helm processing:
            when: '{{ .Values.tests.runStep2 }} == true'
        - - name: run-newman
            template: newman-runner
            # Escaped for Helm processing:
            when: '{{ .Values.tests.runStep3 }} == true'

    # --- STEP 2: Skopeo Push/Pull Registry Test ---
    - name: registry-tester
      container:
        image: quay.io/skopeo/stable:v1.15
        env:
          - name: REGISTRY_HOST
            value: "registry-private-registry:5000"
          - name: REGISTRY_USER
            value: "line"
          - name: REGISTRY_PASS
            value: "nirvana"
        command: [/bin/sh, -c]
        args:
          - |
            set -e
            echo "=== [1/2] Verifying Push to Private Registry ==="
            skopeo copy \
              --dest-creds="${REGISTRY_USER}:${REGISTRY_PASS}" \
              --dest-tls-verify=false \
              docker://docker.io/library/alpine:latest \
              docker://${REGISTRY_HOST}/test-scope/alpine-test:verify

            echo "=== [2/2] Verifying Pull/Inspection ==="
            skopeo inspect \
              --creds="${REGISTRY_USER}:${REGISTRY_PASS}" \
              --tls-verify=false \
              docker://${REGISTRY_HOST}/test-scope/alpine-test:verify
            echo "=== Registry Passed ==="

    # --- STEP 3: Newman API Verification ---
    - name: newman-runner
      inputs:
        artifacts:
          - name: test-repository
            path: /tests
            git:
              repo: "https://github.com/ivanristic/collections.git"
              revision: "main"
      container:
        image: postman/newman:6.1.3-alpine
        command: [newman, run, /tests/smoke-tests.postman_collection.json]
        args:
          - "--env-var"
          - "baseUrl=http://registry-private-registry:5000"

    # --- EXIT HANDLER: Email Report ---
    - name: send-email-report
      when: "{{workflow.status}} == Failed || {{workflow.status}} == Error"
      container:
        image: pyfound/balloons:latest
        command: [/bin/sh, -c]
        args:
          - |
            echo "Sending failure notification email..."
            curl --request POST \
              --url https://api.sendgrid.com/v3/mail/send \
              --header "Authorization: Bearer ${SENDGRID_API_KEY}" \
              --header "Content-Type: application/json" \
              --data '{
                "personalizations": [{"to": [{"email": "devops-team@example.com"}]}],
                "from": {"email": "ivanristich@hotmail.com"},
                "subject": "❌ Argo Workflow Failed: {{workflow.name}}",
                "content": [{"type": "text/plain", "value": "The test pipeline failed in namespace {{workflow.namespace}}. Please check the Argo dashboard."}]
              }'
        env:
          - name: SENDGRID_API_KEY
            valueFrom:
              secretKeyRef:
                name: email-credentials
                key: api-key