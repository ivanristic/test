apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-private-registry
  labels:
    app: private-registry
    release: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: private-registry
    release: {{ .Release.Name }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
