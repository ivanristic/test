apiVersion: v1
kind: ServiceAccount
metadata:
  name: workflow-runner-sa
  namespace: registry
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workflow-pod-patcher
  namespace: registry
rules:
- apiGroups: [""]
  resources: ["pods", "pods/exec"]
  verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workflow-pod-patcher-binding
  namespace: registry
subjects:
- kind: ServiceAccount
  name: workflow-runner-sa # Bound ONLY to our custom SA
  namespace: registry
roleRef:
  kind: Role
  name: workflow-pod-patcher
  apiGroup: rbac.authorization.k8s.io
