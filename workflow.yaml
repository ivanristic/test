apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: git-fetched-api-tests-workflow
  namespace: registry
  annotations:
    # Keeps your Argo CD lifecycle hook so it runs PostSync
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  entrypoint: registry-test-pipeline
  
  # Define a shared Volume Claim Template for the workflow lifecycle
  volumeClaimTemplates:
  - metadata:
      name: shared-volume
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 64Mi

  templates:
  - name: registry-test-pipeline
    # This enforces exact linear execution: Step 1 -> Step 2 -> Step 3
    steps:
    - - name: clone-repo
        template: git-cloner
    - - name: test-registry
        template: registry-tester
    - - name: run-newman
        template: newman-runner

  # --- STEP 1: Clone Git Repo ---
  - name: git-cloner
    container:
      image: alpine/git:2.45.2
      command: [/bin/sh, -c]
      args:
        - |
          git clone --depth 1 https://github.com/ivanristic/collections.git /shared-tests
      volumeMounts:
      - name: shared-volume
        mountPath: /shared-tests

  # --- STEP 2: Skopeo Push/Pull Registry Test ---
  - name: registry-tester
    container:
      image: quay.io/skopeo/stable:v1.15
      env:
      - name: REGISTRY_HOST
        value: "private-registry:5000"
      - name: REGISTRY_USER
        value: "line"
      - name: REGISTRY_PASS
        value: "nirvana"
      command: [/bin/sh, -c]
      args:
        - |
          set -e
          echo "=== [1/2] Verifying Push to Private Registry ==="
          skopeo copy \
            --dest-creds="${REGISTRY_USER}:${REGISTRY_PASS}" \
            --dest-tls-verify=false \
            docker://docker.io/library/alpine:latest \
            docker://${REGISTRY_HOST}/test-scope/alpine-test:verify

          echo "=== [2/2] Verifying Pull/Inspection ==="
          skopeo inspect \
            --creds="${REGISTRY_USER}:${REGISTRY_PASS}" \
            --tls-verify=false \
            docker://${REGISTRY_HOST}/test-scope/alpine-test:verify
          echo "=== Registry Passed ==="

  # --- STEP 3: Newman API Verification ---
  - name: newman-runner
    container:
      image: postman/newman:6.1.3-alpine
      command: [newman, run, /tests/smoke-tests.postman_collection.json]
      args:
      - "--env-var"
      - "baseUrl=http://private-registry:5000"
      volumeMounts:
      - name: shared-volume
        mountPath: /tests
