apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: git-fetched-api-tests-workflow
  namespace: registry
  annotations:
    # Keeps your Argo CD lifecycle hook so it runs PostSync
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  entrypoint: registry-test-pipeline
  serviceAccountName: workflow-runner-sa
  # Define a shared Volume Claim Template for the workflow lifecycle
  volumeClaimTemplates:
  - metadata:
      name: shared-volume
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 64Mi
  arguments:
  # we parametrize tests steps, default is to run all tests, values can be passed by command
  # argo submit selective-workflow.yaml -p run-step-1=false -p run-step-2=true -p run-step-3=false 
    parameters:
      - name: run-step-2
        value: "false"
      - name: run-step-3
        value: "true"
        
  templates:
  - name: registry-test-pipeline
    # This enforces exact linear execution: Step 1 -> Step 2 -> Step 3
    steps:
    - - name: test-registry
        template: registry-tester
        when: "{{workflow.parameters.run-step-2}} == true"
    - - name: run-newman
        template: newman-runner
        when: "{{workflow.parameters.run-step-3}} == true"


  # --- STEP 2: Skopeo Push/Pull Registry Test ---
  - name: registry-tester
    container:
      image: quay.io/skopeo/stable:v1.15
      env:
      - name: REGISTRY_HOST
        value: "private-registry:5000"
      - name: REGISTRY_USER
        value: "line"
      - name: REGISTRY_PASS
        value: "nirvana"
      command: [/bin/sh, -c]
      args:
        - |
          set -e
          echo "=== [1/2] Verifying Push to Private Registry ==="
          skopeo copy \
            --dest-creds="${REGISTRY_USER}:${REGISTRY_PASS}" \
            --dest-tls-verify=false \
            docker://docker.io/library/alpine:latest \
            docker://${REGISTRY_HOST}/test-scope/alpine-test:verify

          echo "=== [2/2] Verifying Pull/Inspection ==="
          skopeo inspect \
            --creds="${REGISTRY_USER}:${REGISTRY_PASS}" \
            --tls-verify=false \
            docker://${REGISTRY_HOST}/test-scope/alpine-test:verify
          echo "=== Registry Passed ==="

  # --- STEP 3: Newman API Verification ---
  - name: newman-runner
    inputs:
        artifacts:
          - name: test-repository
            path: /tests # Argo will clone the repo into this folder
            git:
              repo: "https://github.com/ivanristic/collections.git"
              revision: "main" # Can be a branch, tag, or commit hash
    container:
      image: postman/newman:6.1.3-alpine
      command: [newman, run, /tests/smoke-tests.postman_collection.json]
      args:
      - "--env-var"
      - "baseUrl=http://private-registry:5000"
