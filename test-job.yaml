apiVersion: batch/v1
kind: Job
metadata:
  name: git-fetched-api-tests
  namespace: registry
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      # 1. Download the tests from Git into a shared memory volume
      initContainers:
      - name: git-cloner
        image: alpine/git:2.45.2 
        command:
        - /bin/sh
        - -c
        - |
          # FIX 1: Clone directly into the mounted volume
          git clone --depth 1 https://github.com/ivanristic/collections.git /shared-tests
        volumeMounts:
        - name: shared-volume
          mountPath: /shared-tests

      # 2. Run Newman using the downloaded files
      containers:
      - name: newman-runner
        image: postman/newman:6.1.3-alpine
        # FIX 2: Ensure the path matches the repo structure relative to the mount
        command: ["newman", "run", "/tests/smoke-tests.postman_collection.json"]
        args:
        - "--env-var"
        # FIX 3: Change localhost to the internal Kubernetes Service name
        - "baseUrl=http://registry-service:5000"
        volumeMounts:
        - name: shared-volume
          mountPath: /tests

      restartPolicy: Never
      volumes:
      - name: shared-volume
        emptyDir: {} 
  backoffLimit: 0