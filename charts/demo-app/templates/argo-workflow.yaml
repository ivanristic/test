apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: demo-app-git-pipeline-
  namespace: argo 
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  entrypoint: test-pipeline
  serviceAccountName: demo-pipeline-sa # CLEAN PRACTICE: Explicit non-default execution profile
  
  arguments:
    parameters:
      - name: target-url
        value: "http://demo-app-workflow.demo-testing.svc"
      - name: repo-url
        value: "https://github.com/ivanristic/test.git"
      - name: repo-revision
        value: "demo"

  volumeClaimTemplates:
    - metadata:
        name: workdir
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 64Mi

  templates:
    - name: test-pipeline
      steps:
        - - name: wait-for-deployment
            template: k8s-preflight
          - name: clone-git-repository
            template: clone-repo

        - - name: smoke-test
            template: run-smoke

        - - name: newman-regression
            template: run-newman

          - name: security-audit
            template: run-security-header-check

    # --- Step Templates ---
    - name: clone-repo
      container:
        image: alpine/git:latest
        command: [sh, -c]
        args:
          - |
            echo "Synchronizing workspace with branch: {{ `{{workflow.parameters.repo-revision}}` }}..."
            rm -rf /src/*
            git clone -b {{ `{{workflow.parameters.repo-revision}}` }} {{ `{{workflow.parameters.repo-url}}` }} /src
            echo "Repository successfully synchronized."
        volumeMounts:
          - name: workdir
            mountPath: /src

    - name: k8s-preflight
      container:
        image: bitnami/kubectl:latest
        command: [sh, -c]
        args:
          - |
            echo "Checking deployment rollout status..."
            kubectl rollout status deployment/demo-app-workflow -n demo-testing --timeout=60s

    - name: run-smoke
      container:
        image: curlimages/curl:7.85.0
        command: [sh, -c]
        args:
          - |
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" {{ `{{workflow.parameters.target-url}}` }}/health)
            if [ "$STATUS" -ne 200 ]; then
              echo "Smoke Test Failed: /health returned status $STATUS"
              exit 1
            fi
            echo "Smoke Test Passed."

    - name: run-newman
      container:
        image: postman/newman:6-alpine
        command: [sh, -c]
        args:
          - |
            echo "Locating workspace test suite..."
            BASE=$(echo "{{ `{{workflow.parameters.target-url}}` }}" | sed 's|http://||')
            newman run /src/tests/collection.json --env-var "baseUrl=$BASE"
        volumeMounts:
          - name: workdir
            mountPath: /src

    - name: run-security-header-check
      container:
        image: curlimages/curl:7.85.0
        command: [sh, -c]
        args:
          - |
            HEADERS=$(curl -sI {{ `{{workflow.parameters.target-url}}` }}/api/v1/data)
            if echo "$HEADERS" | grep -iq "X-Powered-By"; then
              echo "Security Warning: Runtime stack details exposed via X-Powered-By header!"
            fi
            echo "Header verification scan complete."