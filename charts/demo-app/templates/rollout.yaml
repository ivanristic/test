apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    blueGreen:
      activeService: {{ .Release.Name }}
      previewService: {{ .Release.Name }}-preview
      autoPromotionEnabled: false
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      # 1. Share a directory between the init container and the app container
      volumes:
        - name: node-modules
          emptyDir: {}

      # 2. Use an init container to install express before launching the app
      initContainers:
        - name: install-deps
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          workingDir: /app
          command: ["sh", "-c", "npm install express"]
          volumeMounts:
            - name: node-modules
              mountPath: /app/node_modules

      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          workingDir: /app
          command:
            - "node"
            - "-e"
            - |
{{ .Files.Get "app.js" | indent 14 }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          # 3. Mount the volume containing installed modules into the app path
          volumeMounts:
            - name: node-modules
              mountPath: /app/node_modules
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
